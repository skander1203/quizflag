<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Globe ocean -->
    <circle cx="256" cy="268" r="168" fill="#1a6bb5"/>

    <!-- Latitude lines -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5">
      <ellipse cx="256" cy="268" rx="168" ry="42"/>
      <ellipse cx="256" cy="268" rx="168" ry="84"/>
      <ellipse cx="256" cy="268" rx="168" ry="126"/>
      <ellipse cx="256" cy="268" rx="42" ry="168"/>
      <ellipse cx="256" cy="268" rx="84" ry="168"/>
      <ellipse cx="256" cy="268" rx="126" ry="168"/>
    </g>

    <!-- Continents -->
    <g fill="#2d8a4e">
      <!-- Americas -->
      <path d="M148 196c-10 18-14 42-8 64 6 22 18 38 22 58 4 20-2 36-10 48-8 12-6 24 2 30 8 6 18 2 24-10 6-12 8-30 4-48-4-18-2-38 6-56 8-18 10-38 2-54-8-16-24-28-42-32z"/>
      <path d="M168 318c-4 14-2 28 4 36 6 8 14 8 20 0 6-8 8-22 4-34-4-12-12-18-18-14-6 4-8 8-10 12z"/>
      <!-- Africa -->
      <path d="M268 168c-14 4-24 18-26 34-2 16 4 32 8 48 4 16 2 34-6 50-8 16-22 28-24 44-2 16 8 30 22 34 14 4 28-4 34-18 6-14 4-32-2-48-6-16-8-34-4-52 4-18 14-34 28-42 14-8 18-22 10-34-8-12-26-18-40-16z"/>
      <!-- Europe / Asia -->
      <path d="M292 132c18-6 38-2 52 10 14 12 22 30 24 48 2 18-4 36-16 48-12 12-28 16-42 12-14-4-26-16-32-30-6-14-4-30 4-44 8-14 22-24 38-28 10-2 18-10 16-18-2-8-12-12-24-10-12 2-22 8-28 16-6 8-8 18-4 26 4 8 12 12 20 10 8-2 14-8 16-16 2-8-2-16-8-20z"/>
      <path d="M348 196c12 2 22 10 28 22 6 12 6 26 0 38-6 12-18 20-32 22-14 2-28-4-36-16-8-12-8-28-2-40 6-12 18-20 32-22 4 0 8-2 10-4z"/>
    </g>

    <!-- Globe outline -->
    <circle cx="256" cy="268" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

    <!-- Flag pins -->
    <g>
      <!-- Red flag -->
      <line x1="198" y1="214" x2="198" y2="248" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <rect x="198" y="206" width="16" height="10" rx="1" fill="#ef4444"/>
      <!-- Blue flag -->
      <line x1="312" y1="188" x2="312" y2="222" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <rect x="312" y="180" width="16" height="10" rx="1" fill="#3b82f6"/>
      <!-- Green flag -->
      <line x1="330" y1="268" x2="330" y2="302" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <rect x="330" y="260" width="16" height="10" rx="1" fill="#22c55e"/>
      <!-- Yellow flag -->
      <line x1="178" y1="292" x2="178" y2="326" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <rect x="178" y="284" width="16" height="10" rx="1" fill="#eab308"/>
    </g>
  </g>
</svg>
