        <rect x="0" y="-13" width="20" height="13" rx="1" fill="#007749"/>
        <polygon points="0,-13 8,-6.5 0,0" fill="#007749"/>
        <rect x="8" y="-13" width="12" height="4" fill="#de3831"/>
        <rect x="8" y="-5" width="12" height="3" fill="#ffb612"/>
        <rect x="8" y="0" width="12" height="4" fill="#002395"/>
        <line x1="0" y1="-13" x2="8" y2="-6.5" stroke="#ffffff" stroke-width="0.8"/>
