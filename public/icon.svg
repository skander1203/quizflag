      <path fill="#c4a35a" d="M116 168c8 10 12 24 10 38-2 14-12 26-10 40 2 14 14 20 24 14 10-6 10-18 8-30-2-12 4-24 12-32 8-8 6-18 0-26-6-8-18-10-28-4-8 6-12 16-10 26 2 10 12 16 22 10 10-6 10-18 4-28-6-10-16-14-26-8z"/>
