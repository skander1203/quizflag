        <rect x="0" y="-13" width="20" height="13" rx="1" fill="#ffffff"/>
        <rect x="0" y="-13" width="8" height="7" fill="#3c3b6e"/>
        <rect x="0" y="-6" width="20" height="2" fill="#b22234"/>
        <rect x="0" y="-2" width="20" height="2" fill="#b22234"/>
        <rect x="0" y="2" width="20" height="2" fill="#b22234"/>
        <rect x="0" y="-10" width="20" height="2" fill="#b22234"/>
