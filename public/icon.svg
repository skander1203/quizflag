      </g>

      <!-- Australia -->
      <g transform="translate(376, 346)">
        <line x1="0" y1="0" x2="0" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <rect x="0" y="-13" width="20" height="13" rx="1" fill="#00008b"/>
        <rect x="0" y="-13" width="9" height="7" fill="#012169"/>
        <rect x="0" y="-10" width="9" height="1.2" fill="#ffffff"/>
        <rect x="4" y="-13" width="1.2" height="7" fill="#ffffff"/>
        <rect x="0" y="-9.4" width="9" height="0.6" fill="#c8102e"/>
        <rect x="4.6" y="-13" width="0.6" height="7" fill="#c8102e"/>
        <polygon points="10,-4 10.8,-2 12.6,-2 11.2,-0.8 11.6,1 10,0 8.4,1 8.8,-0.8 7.4,-2 9.2,-2" fill="#ffffff"/>
        <circle cx="15" cy="-3" r="0.9" fill="#ffffff"/>
        <circle cx="17" cy="-6" r="0.7" fill="#ffffff"/>
        <circle cx="14" cy="-8" r="0.7" fill="#ffffff"/>
