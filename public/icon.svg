      <ellipse cx="208" cy="308" rx="36" ry="26" fill="#0d4a8a" opacity="0.55"/>
      <ellipse cx="338" cy="218" rx="30" ry="22" fill="#0d4a8a" opacity="0.45"/>
      <ellipse cx="292" cy="358" rx="26" ry="18" fill="#0d4a8a" opacity="0.4"/>

