<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="oceanShade" cx="32%" cy="30%" r="68%" fx="28%" fy="26%">
      <stop offset="0%" stop-color="#2a8ad4"/>
      <stop offset="45%" stop-color="#1a6bb5"/>
      <stop offset="100%" stop-color="#0a3d6b"/>
    </radialGradient>

    <clipPath id="iconClip">
      <rect width="512" height="512" rx="100" ry="100"/>
    </clipPath>

    <clipPath id="globeClip">
      <circle cx="256" cy="268" r="168"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <circle cx="256" cy="268" r="168" fill="url(#oceanShade)"/>

    <g clip-path="url(#globeClip)">
