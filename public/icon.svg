      <g fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5">
        <path d="M128 238c20-6 40-6 60 0s40 6 60 0"/>
        <path d="M148 288c18-5 36-5 54 0s36 5 54 0"/>
        <path d="M278 178c22-5 44-5 66 0s44 5 66 0"/>
