      <ellipse cx="256" cy="268" rx="168" ry="84"/>
      <ellipse cx="256" cy="268" rx="168" ry="126"/>
      <ellipse cx="256" cy="268" rx="42" ry="168"/>
      <ellipse cx="256" cy="268" rx="84" ry="168"/>
      <ellipse cx="256" cy="268" rx="126" ry="168"/>
